<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="MJL — магазин электроники и полезных гаджетов.">
  <title>MJL — магазин электроники</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101827;color:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#25344c 0%,#101827 58%)}
    main{width:min(100%,680px);padding:clamp(28px,7vw,64px);border:1px solid #34445d;border-radius:28px;background:rgba(18,29,47,.88);box-shadow:0 28px 80px #050b16aa}
    .mark{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:17px;background:#f59e0b;color:#111827;font-weight:900;font-size:21px;letter-spacing:-1px}
    .eyebrow{margin:28px 0 12px;color:#fbbf24;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(38px,8vw,62px);letter-spacing:-.055em;line-height:1.02}
    p{max-width:48ch;color:#c4cfdd;font-size:17px;line-height:1.7}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:22px;padding:10px 14px;border:1px solid #43536b;border-radius:999px;color:#dce5f1;font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 4px #f59e0b22}
    footer{margin-top:46px;color:#8291a7;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="MJL">MJL</div>
    <div class="eyebrow">Магазин электроники</div>
    <h1>Технологии для повседневной жизни.</h1>
    <p>Здесь появятся каталог товаров, актуальные цены и оформление заказов через Telegram. Сейчас мы завершаем настройку магазина.</p>
    <div class="status"><span class="dot"></span> Подготовка к запуску</div>
    <footer>© MJL · Официальная страница магазина</footer>
  </main>
</body>
</html>
